name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash zsh
      - name: Run tests
        run: |
          if ! ./tests/run-test.sh; then
            echo "Tests failed"
            git --no-pager diff
            exit 1
          fi

  action-test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test cute-action
        uses: ./
        with:
          tasks: |
            test
            Bash Shell
          working-directory: ./tests
