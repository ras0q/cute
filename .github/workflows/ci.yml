name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: |
          if ! ./tests/run-test.sh; then
            echo "Tests failed"
            git --no-pager diff
            exit 1
          fi
