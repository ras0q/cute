name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-slim, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          case "${{ matrix.os }}" in
            "ubuntu-slim")
              sudo apt-get update && sudo apt-get install -y bash zsh
              ;;
            "macos-latest")
              brew install bash zsh
              ;;
          esac
      - name: Run tests
        run: |
          if ! ./tests/run-test.sh; then
            echo "Tests failed"
            git --no-pager diff
            exit 1
          fi
