name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: |
          if ! ./tests/run-test.sh; then
            echo "Tests failed"
            git --no-pager diff
            exit 1
          fi
        shell: zsh {0}
